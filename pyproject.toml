[project]
name = "jarvis"
version = "1.0.1"
description = "Agente pessoal autônomo para Linux"
requires-python = ">=3.14"
dependencies = [
    "rich>=13.9",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]
voz = [
    "sounddevice>=0.5",
    "numpy>=2.1",
    "faster-whisper>=1.0",
    "piper-tts>=1.7",
]
computador = [
    "evdev>=1.7",
]

[project.scripts]
jarvis = "jarvis.io.cli:principal"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sounddevice.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
